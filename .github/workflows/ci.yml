name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The vitest suite runs against src/; this proves the artifact that actually ships loads
      # and works from both an ESM and a CJS consumer.
      - name: Smoke-test the built package
        run: pnpm test:dist

      - name: Validate package exports
        run: |
          pnpm exec publint
          pnpm exec attw --pack .

  test:
    name: Test (kea ${{ matrix.kea }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The peer range is `kea >= 3`, matching every first-party kea plugin. Pin the floor of
        # that range, the current stable line, and the v4 prerelease PostHog runs on.
        kea: ['3.0', '3', 'next']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install kea@${{ matrix.kea }}
        if: matrix.kea != '3'
        env:
          KEA_VERSION: ${{ matrix.kea }}
        run: pnpm add -D --ignore-scripts "kea@$KEA_VERSION"

      - name: Report resolved kea version
        run: node -p "'kea ' + require('kea/package.json').version"

      - name: Test
        run: pnpm test
