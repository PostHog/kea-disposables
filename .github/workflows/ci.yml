name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The vitest suite runs against src/; this proves the artifact that actually ships loads
      # and works from both an ESM and a CJS consumer.
      - name: Smoke-test the built package
        run: pnpm test:dist

      - name: Validate package exports
        run: |
          pnpm exec publint
          pnpm exec attw --pack .

  test:
    name: Test (kea ${{ matrix.kea }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The peer range is `kea >= 3`, matching every first-party kea plugin. Pin the floor of
        # that range, the current stable line, and the v4 prerelease PostHog runs on.
        kea: ['3.0', '3', 'next']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install kea@${{ matrix.kea }}
        if: matrix.kea != '3'
        env:
          KEA_VERSION: ${{ matrix.kea }}
        run: pnpm add -D --ignore-scripts "kea@$KEA_VERSION"

      - name: Report resolved kea version
        run: node -p "'kea ' + require('kea/package.json').version"

      - name: Test
        run: pnpm test
