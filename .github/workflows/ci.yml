name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The vitest suite runs against src/; this proves the artifact that actually ships loads
      # and works from both an ESM and a CJS consumer.
      - name: Smoke-test the built package
        run: npm run test:dist

      - name: Validate package exports
        run: |
          npx --no-install publint
          npx --no-install attw --pack .

  test:
    name: Test (kea ${{ matrix.kea }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The peer range is `kea >= 3`, matching every first-party kea plugin. Pin the floor of
        # that range, the current stable line, and the v4 prerelease PostHog runs on.
        kea: ['3.0', '3', 'next']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install kea@${{ matrix.kea }}
        if: matrix.kea != '3'
        env:
          KEA_VERSION: ${{ matrix.kea }}
        run: npm install --no-save --ignore-scripts "kea@$KEA_VERSION"

      - name: Report resolved kea version
        run: node -p "'kea ' + require('kea/package.json').version"

      - name: Test
        run: npm test
